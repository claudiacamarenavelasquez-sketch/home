async function compactPurchaseImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{try{
   const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
   const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.78).split(',')[1]);
  }catch(e){URL.revokeObjectURL(url);reject(e)}};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('No se pudo abrir la imagen. Prueba JPG o PNG.'))};img.src=url;
 });
}

}
async function scanPurchasePhoto(){
 const frm=document.getElementById('entryform'),file=frm?.elements.photo.files?.[0],box=document.getElementById('purchaseAI');
 if(!file){alert('Primero toma o selecciona una foto del producto o de su etiqueta.');return}
 if(!cloud){alert('El escaneo automático solo funciona en la web publicada con Google Apps Script.');return}
 const btn=box.querySelector('button');btn.disabled=true;btn.textContent='Analizando imagen…';
 try{
  const image=await compactPurchaseImage(file);
  const res=await runRemote('analyzePurchasePhoto',image);
  const v=res.product||{};
  for(const [key,value] of Object.entries({name:v.name,qtyGrams:v.qtyGrams,protein100:v.protein100,price:v.price})){
   if(value!==null&&value!==undefined&&value!==''&&frm.elements[key])frm.elements[key].value=value;
  }
  const inferred=(v.estimatedFields||[]).join(', ');
  box.querySelector('p').textContent=(res.message||'Revisa los datos detectados antes de guardar.')+(inferred?' Estimaciones: '+inferred+'.':'')+' Los campos sin evidencia quedan vacíos.';
  btn.textContent='↻ Volver a analizar';
 }catch(e){box.querySelector('p').textContent='No se pudo analizar: '+(e.message||e);btn.textContent='Reintentar escaneo'}
 finally{btn.disabled=false}
}

async function savePurchase(id){
 const frm=document.getElementById('entryform'),file=frm.elements.photo.files[0],d=data();
 let photoUrl=(state.purchases||[]).find(x=>x.id===id)?.photoUrl||'';
 const grams=Number(d.qtyGrams),per100=Number(d.protein100);
 if(d.qtyGrams!==''&&d.protein100!==''&&per100>100){alert('La proteína por 100 g no puede superar 100 g');return;}
 if(file){
   if(!cloud){alert('Para guardar fotos debes abrir la aplicación publicada con Google Apps Script. Puedes guardar el registro sin foto.');return;}
   if(file.size>5*1024*1024){alert('Foto demasiado grande. Máximo 5 MB.');return;}
   const btn=frm.querySelector('[type="submit"]');btn.disabled=true;btn.textContent='Subiendo foto…';

     const base64=await compactPurchaseImage(file);

     photoUrl=res.url;
   }catch(err){btn.disabled=false;btn.textContent='Guardar registro';alert('No se pudo subir la foto: '+(err.message||err));return;}
 }
 const item={id:id||uid(),date:d.date,name:d.name,store:d.store,qtyGrams:d.qtyGrams,protein100:d.protein100,proteinTotal:d.qtyGrams!==''&&d.protein100!==''?String(Math.round(grams*per100/100*10)/10):'',price:d.price,person:d.person,notes:d.notes,photoUrl};
 if(!Array.isArray(state.purchases))state.purchases=[];
 if(id)state.purchases=state.purchases.map(x=>x.id===id?item:x);else state.purchases.push(item);
 save();closeModal();render();
}

function cats(){return `${heading('Hera & Ramsés','Tu diario veterinario y de bienestar',`<button class="btn" onclick="petLogForm()">＋ Registrar evento</button>`)}<div class="petgrid">${state.pets.map(p=>{const entries=state.petlogs.filter(l=>l.pet===p.name).sort((a,b)=>b.date.localeCompare(a.date)),weights=entries.filter(l=>l.type==='Peso');return `<div class="petcard"><div class="pethead"><div class="peticon">${p.emoji}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.notes)}</p></div></div><div class="petfacts"><div><small>Último peso</small><b>${weights.length?esc(weights[0].value)+' kg':'Sin registro'}</b></div><div><small>Alimentación actual</small><b style="font-size:14px">${esc(p.food||'Por registrar')}</b></div></div><button class="btn outline small" onclick="petForm('${p.id}')">Editar ficha</button> <button class="btn small" onclick="petLogForm('${p.name}')">＋ Evento</button><div style="margin-top:19px"><b>Últimos registros</b>${entries.length?entries.slice(0,4).map(l=>`<div class="activity"><span class="dot">${({Peso:'⚖️',Vómito:'🩺',Vacuna:'💉',Veterinario:'🏥',Alimentación:'🥣'})[l.type]||'🐾'}</span><div style="flex:1"><b>${esc(l.type)}${l.value?' · '+esc(l.value):''}</b><span>${fmt(l.date)} · ${esc(l.notes||'')}</span></div></div>`).join(''):'<div class="empty">No hay eventos todavía</div>'}</div></div>`}).join('')}</div>${heading('Historial veterinario y cuidados','Filtra todos los episodios y mediciones')}<div class="tablewrap"><table class="datatable"><thead><tr><th>Fecha</th><th>Gato</th><th>Tipo</th><th>Valor / producto</th><th>Detalle</th><th></th></tr></thead><tbody>${state.petlogs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<tr><td>${fmt(l.date)}</td><td>${esc(l.pet)}</td><td>${esc(l.type)}</td><td>${esc(l.value||'—')}</td><td class="desc">${esc(l.notes||'')}</td><td><button class="quiet" onclick="del('petlogs','${l.id}')">×</button></td></tr>`).join('')}</tbody></table>${!state.petlogs.length?'<div class="empty">Añade su primera vacuna, consulta, episodio de vómito o control de peso.</div>':''}</div><div class="detail">🐾 Sugerencia: registra alimento y marca, cantidad, cambios en apetito, vómitos (hora y frecuencia), visitas al veterinario, vacunas, antiparasitarios, esterilización y peso. Si hay vómitos repetidos, sangre o decaimiento, consulta al veterinario.</div>`}
function routines(){return `${heading('Rituales de casa','Cuidados recurrentes y mantenimiento sin olvidos',`<button class="btn" onclick="taskForm()">＋ Nueva rutina</button>`)}<div class="notice green">✓ Pulsa <b>Hecho hoy</b> al completar una actividad. El sistema calcula la siguiente fecha usando la frecuencia que elijas. Puedes ajustar manualmente cuándo se realizó.</div><div class="tiles">${state.tasks.map(t=>`<div class="tile" style="cursor:default"><div style="display:flex;justify-content:space-between;gap:8px"><span class="emoji">${({Dormitorio:'🛏️',Plantas:'🪴',Lavandería:'🧺',Mantenimiento:'🛋️',Compras:'🛍️',Gatos:'🐈',Salud:'💊'})[t.category]||'🏡'}</span><span class="pill ${taskStatus(t)[1]}">${taskStatus(t)[0]}</span></div><h3>${esc(t.name)}</h3><p>Cada ${t.interval} días · ${esc(t.person||'Hogar')}</p><p style="margin-top:8px">Última: ${t.last?fmt(t.last):'Sin registro'}<br>Próxima: ${due(t)?fmt(due(t)):'Por definir'}</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px"><button class="btn small" onclick="complete('${t.id}')">✓ Hecho hoy</button><button class="btn outline small" onclick="taskForm('${t.id}')">Editar</button><button class="quiet" onclick="del('tasks','${t.id}')">×</button></div></div>`).join('')}</div>`}function historyPage(){let events=[...state.events.map(e=>({...e,group:'Hogar'})),...state.petlogs.map(e=>({...e,name:e.pet+' · '+e.type,group:'Gatos',person:'',notes:[e.value,e.notes].filter(Boolean).join(' · ')}))].sort((a,b)=>b.date.localeCompare(a.date));return `${heading('Historial de casa','Todo lo que pasó y cuándo pasó',`<button class="btn" onclick="eventForm()">＋ Registrar actividad</button>`)}<div class="tablewrap"><table class="datatable"><thead><tr><th>Fecha</th><th>Área</th><th>Actividad</th><th>Responsable</th><th>Detalle</th><th></th></tr></thead><tbody>${events.map(e=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.group)}</td><td><b>${esc(e.name)}</b></td><td>${esc(e.person||'—')}</td><td class="desc">${esc(e.notes||'')}</td><td><button class="quiet" onclick="del('${e.group==='Gatos'?'petlogs':'events'}','${e.id}')">×</button></td></tr>`).join('')}</tbody></table>${events.length?'':'<div class="empty">Los cuidados y eventos que registres aparecerán aquí.</div>'}</div>`}function settings(){return `${heading('Configuración y respaldos','Tus datos, bajo tu control')}<div class="twocol"><div class="panel"><h3>Exportar una copia de seguridad</h3><p style="line-height:1.7;color:#798b83">Descarga un archivo JSON con todo tu botiquín, los registros de Hera y Ramsés, la lista de compras y el historial del hogar. Puedes importarlo en otro dispositivo.</p><button class="btn" onclick="exportData()">↓ Exportar respaldo</button></div><div class="panel"><h3>Importar un respaldo</h3><p style="line-height:1.7;color:#798b83">Selecciona el archivo exportado para reemplazar los datos de este navegador. Guarda antes una copia de los datos actuales.</p><input type="file" id="importfile" accept="application/json,.json" style="max-width:100%" onchange="importData(this)"></div></div><div class="notice">🔒 <b>Privacidad y sincronización:</b> si se abre desde la URL de Google Apps Script, los cambios se sincronizan mediante Google Sheets. El archivo HTML descargado sigue funcionando solo en modo local. Comparte el Sheet únicamente con personas autorizadas; contiene información médica y veterinaria.</div><div class="panel"><h3>Empezar de cero</h3><p>Restaura el inventario precargado. Esta acción borra las modificaciones y eventos guardados en este navegador.</p><button class="btn danger" onclick="resetData()">Restablecer datos</button></div>`}
function modal(title,subtitle,body,submit){$('#modalroot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><p>${subtitle}</p><form id="entryform" onsubmit="event.preventDefault();${submit}"><div class="formgrid">${body}</div><div class="modalbuttons"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button type="submit" class="btn">Guardar registro</button></div></form></div></div>`}function closeModal(){$('#modalroot').innerHTML=''}function f(label,name,val='',type='text',extra='',full=false){return `<label class="${full?'full':''}">${label}<input name="${name}" type="${type}" value="${esc(val)}" ${extra}></label>`}function sel(label,name,options,chosen='',full=false){return `<label class="${full?'full':''}">${label}<select name="${name}">${options.map(v=>`<option value="${esc(v)}" ${v===chosen?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`}function area(label,name,val=''){return `<label class="full">${label}<textarea name="${name}">${esc(val)}</textarea></label>`}const data=()=>Object.fromEntries(new FormData($('#entryform')).entries());function medForm(id){let m=state.meds.find(x=>x.id===id)||{};modal(id?'Editar medicamento':'Nuevo medicamento','Registra cada lote por separado si tiene distinta fecha de vencimiento',f('Nombre','name',m.name,'text','required',true)+sel('Categoría','category',['Dolor','Digestivo','Respiratorio','Alergias','Antibiótico','Antiviral','Piel','Prescripción','Curaciones','Suplemento','Otro'],m.category)+f('Cantidad / presentación','qty',m.qty)+f('Principio activo','ingredient',m.ingredient,'text','',true)+f('¿Para qué sirve?','use',m.use,'text','',true)+f('Vencimiento (mes y año aproximados si no conoces día)','expiry',m.expiry,'date')+sel('Fecha confirmada','approx',['Sí','No'],m.approx?'No':'Sí')+area('Notas','notes',m.notes),`saveMed('${id||''}')`)}function saveMed(id){let x=data();let m={...x,id:id||uid(),approx:x.approx==='No'};if(id)state.meds=state.meds.map(v=>v.id===id?m:v);else state.meds.push(m);save();closeModal();render()}
function petForm(id){let p=state.pets.find(v=>v.id===id);modal('Ficha de '+p.name,'Datos básicos de tu michi',f('Nombre','name',p.name,'text','required')+f('Emoji','emoji',p.emoji)+f('Comida actual','food',p.food,'text','',true)+area('Datos relevantes','notes',p.notes),`savePet('${id}')`)}function savePet(id){Object.assign(state.pets.find(v=>v.id===id),data());save();closeModal();render()}
function petLogForm(pet='Hera'){modal('Nuevo registro de gatos','Controles, síntomas, vacunas, alimentación y visitas',sel('¿De quién?','pet',state.pets.map(p=>p.name),pet)+sel('Tipo de registro','type',['Peso','Vómito','Veterinario','Vacuna','Desparasitación','Alimentación','Medicamento','Síntoma','Otro'])+f('Fecha','date',today(),'date','required')+f('Valor / vacuna / comida / kg','value','','text','',true)+area('Detalles / observaciones','notes'),`savePetLog()`)}function savePetLog(){state.petlogs.push({...data(),id:uid()});save();closeModal();render()}
function taskForm(id){let t=state.tasks.find(v=>v.id===id)||{};modal(id?'Editar rutina':'Nueva rutina','Frecuencia sugerida en días, ajustable según tu hogar',f('Actividad','name',t.name,'text','required',true)+sel('Área','category',['Dormitorio','Plantas','Lavandería','Mantenimiento','Compras','Gatos','Salud','Cocina','Baño','Otro'],t.category)+f('Repetir cada (días)','interval',t.interval||7,'number','min="1" required')+f('Última vez realizada','last',t.last,'date')+f('Responsable','person',t.person||'Jorge y Claudia')+area('Notas','notes',t.notes),`saveTask('${id||''}')`)}function saveTask(id){let x=data();x.interval=Number(x.interval);x.id=id||uid();if(id)state.tasks=state.tasks.map(t=>t.id===id?x:t);else state.tasks.push(x);save();closeModal();render()}function complete(id){let t=state.tasks.find(v=>v.id===id);t.last=today();state.events.push({id:uid(),date:today(),name:t.name,person:t.person,notes:'Rutina completada · '+t.category});save();render()}
function eventForm(){modal('Registrar actividad','Para compras, mantenimientos y cualquier acontecimiento',f('Actividad','name','','text','required',true)+f('Fecha','date',today(),'date','required')+f('Responsable','person','Jorge y Claudia')+area('Detalle (proveedor, monto, observaciones)','notes'),`saveEvent()`)}function saveEvent(){state.events.push({...data(),id:uid()});save();closeModal();render()}function del(collection,id){if(!confirm('¿Eliminar este registro?'))return;state[collection]=state[collection].filter(v=>v.id!==id);save();render()}
function quick(){modal('¿Qué vas a registrar?','Selecciona el módulo que quieras completar',`<div class="full" style="display:grid;gap:9px"><button class="btn outline" type="button" onclick="closeModal();medForm()">💊 Medicamento</button><button class="btn outline" type="button" onclick="closeModal();petLogForm()">🐾 Evento de Hera o Ramsés</button><button class="btn outline" type="button" onclick="closeModal();eventForm()">🏡 Actividad de casa</button><button class="btn outline" type="button" onclick="closeModal();taskForm()">🧹 Nueva rutina</button><button class="btn outline" type="button" onclick="closeModal();shopForm()">🛒 Producto de compras</button><button class="btn outline" type="button" onclick="closeModal();purchaseForm()">🧺 Compra con gramos y proteína</button></div>`,`closeModal()`)}function exportData(){const blob=new Blob([JSON.stringify({...state,version:1,exported:today()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Casa-CJ-respaldo-'+today()+'.json';a.click();URL.revokeObjectURL(url)}function importData(input){let file=input.files[0];if(!file)return;const reader=new FileReader;reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!['meds','pets','petlogs','tasks','events'].every(k=>Array.isArray(o[k])))throw Error('Formato incompatible');if(!confirm('Esto reemplazará los datos actuales de este navegador. ¿Continuar?'))return;state={...defaultState(),...o};if(!Array.isArray(state.shopping))state.shopping=shoppingSeed.map(x=>({...x}));save();render();alert('Respaldo importado')}catch(e){alert('No se pudo importar: '+e.message)}};reader.readAsText(file)}function resetData(){if(confirm('¿Restablecer y borrar cambios, registros y eventos guardados en este dispositivo?')){state=defaultState();save();render()}}render();syncInit();
</script></body></html>
