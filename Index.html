async function loginStart(){

    const response=await fetch('/api/auth',{cache:'no-store'});

}const uid=()=>Math.random().toString(36).slice(2,11);let page='inicio',filter='',q='';const pages=[['inicio','◫','Inicio'],['botiquin','💊','Botiquín'],['gatos','🐾','Gatos'],['rutinas','🧹','Hogar'],['compras','🛒','Compras'],['historial','▤','Historial'],['ajustes','⚙','Ajustes']];function status(m){if(!m.expiry)return ['Sin fecha','warn'];const d=new Date(m.expiry+'T12:00:00');let last=new Date(d.getFullYear(),d.getMonth()+1,0);let days=(last-new Date())/86400000;if(days<0)return ['Vencido','bad'];if(days<=90)return ['Próximo','warn'];return ['Vigente',''];}function due(t){if(!t.last)return null;let d=new Date(t.last+'T12:00:00');d.setDate(d.getDate()+Number(t.interval||0));return d.toLocaleDateString('en-CA')};function taskStatus(t){const d=due(t);return !d?['Sin registro','warn']:d<today()?['Pendiente','bad']:d===today()?['Hoy','warn']:['Al día','']};function nav(){ $('#nav').innerHTML=pages.map(([id,ic,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')" title="${label}"><span>${ic}</span><span class="navlabel">${label}</span></button>`).join('')}function go(p){page=p;filter='';q='';render();scrollTo(0,0)}function render(){nav();$('#crumb').textContent='Casa / '+pages.find(x=>x[0]===page)[2];$('#view').innerHTML=({inicio:home,botiquin:meds,gatos:cats,rutinas:routines,compras:shoppingPage,historial:historyPage,ajustes:settings})[page]();}function stat(label,num,hint,icon){return `<div class="stat"><span class="symbol">${icon}</span><span class="smallcap">${label}</span><strong>${num}</strong><small>${hint}</small></div>`}function heading(a,b,button=''){return `<div class="sectionhead"><div><h2>${a}</h2><p>${b}</p></div>${button}</div>`}function home(){const expired=state.meds.filter(m=>status(m)[1]==='bad').length,soon=state.meds.filter(m=>status(m)[1]==='warn'&&m.expiry).length, pending=state.tasks.filter(t=>taskStatus(t)[1]==='bad'||!t.last).length,logs=[...state.petlogs.map(x=>({date:x.date,label:`${x.pet} · ${x.type}`,sub:x.notes||x.value|| no hay actividad registrada. Empieza por un peso, una vacuna o una tarea realizada.</div>'}</div><div class="panel"><h3>Próximos cuidados</h3>${state.tasks.slice().sort((a,b)=>(due(a)||'0000').localeCompare(due(b)||'0000')).slice(0,5).map(t=>`<div class="activity"><span class="dot">✓</span><div style="flex:1"><b>${esc(t.name)}</b><span>${due(t)?fmt(due(t)):'Registra la última fecha'}</span></div><span class="pill ${taskStatus(t)[1]}">${taskStatus(t)[0]}</span></div>`).join('')}<button class="btn outline small" style="margin-top:12px" onclick="go('rutinas')">Gestionar rutinas</button></div></div>`}

let voiceRecorder=null,voiceStream=null,voiceTimer=null,voiceDraft=null,voiceGeneration=0;
function stopVoice(){clearTimeout(voiceTimer);if(voiceRecorder&&voiceRecorder.state!=='inactive')voiceRecorder.stop();else if(voiceStream)voiceStream.getTracks().forEach(t=>t.stop());}

async function recordShoppingVoice(){
 const gen=voiceGeneration, status=document.getElementById('voiceStatus'),record=document.getElementById('voiceRecord'),stop=document.getElementById('voiceStop');
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status.textContent='Tu navegador no permite grabar audio. Usa el micrófono del teclado o escribe el texto.';return;}
 record.disabled=true;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(gen!==voiceGeneration||!status.isConnected){stream.getTracks().forEach(t=>t.stop());return;}
  voiceStream=stream;
  const mime=['audio/webm;codecs=opus','audio/mp4','audio/webm','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported(t));
  const recorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  voiceRecorder=recorder;const chunks=[];
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  recorder.onstop=async()=>{
   clearTimeout(voiceTimer);stream.getTracks().forEach(t=>t.stop());voiceStream=null;voiceRecorder=null;
   if(gen!==voiceGeneration||!status.isConnected)return;
   stop.disabled=true;status.textContent='Transcribiendo audio…';
   try{
    const blob=new Blob(chunks,{type:recorder.mimeType||mime||'audio/webm'});
    if(!blob.size||blob.size>2400000)throw Error('Audio vacío o demasiado grande. Prueba una grabación más corta.');
    const base64=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(String(fr.result).split(',')[1]);fr.onerror=reject;fr.readAsDataURL(blob);});
    const response=await runRemote('transcribeShoppingVoice',base64,blob.type);
    if(gen!==voiceGeneration||!status.isConnected)return;
    document.querySelector('#entryform textarea[name=dictation]').value=response.text;
    status.textContent='Audio transcrito. Identificando productos…';
    await analyzeShoppingVoice();
   }catch(e){if(status.isConnected)status.textContent='No se pudo transcribir: '+e.message+'. Puedes escribir o usar el dictado del teclado.';}
   finally{if(record.isConnected)record.disabled=false;}
  };
  recorder.start();stop.disabled=false;status.textContent='🔴 Grabando… habla normalmente y pulsa Detener.';voiceTimer=setTimeout(()=>{if(recorder.state!=='inactive')recorder.stop();},60000);
 }catch(e){if(voiceStream)voiceStream.getTracks().forEach(t=>t.stop());record.disabled=false;status.textContent='No se pudo acceder al micrófono. Revisa permisos o escribe el texto.';}
}
async function analyzeShoppingVoice(){
 const gen=voiceGeneration,form=document.getElementById('entryform'),status=document.getElementById('voiceStatus'),btn=document.getElementById('voiceAnalyze'),results=document.getElementById('voiceResults');
 const transcript=form?.elements.dictation?.value.trim();
 if(!transcript){status.textContent='Primero graba o escribe lo que necesitas.';return;}
 if(!syncReady||syncError||syncBusy){status.textContent='Primero actualiza los datos desde Sheets.';return;}
 btn.disabled=true;form.querySelector('[type=submit]').disabled=true;voiceDraft=null;results.innerHTML='';status.textContent='Identificando productos…';
 try{
  const catalog=state.shopping.map(x=>({id:x.id,name:x.name,category:x.category}));
  const res=await runRemote('interpretShoppingVoice',transcript,catalog);
  if(gen!==voiceGeneration||!form.isConnected)return;
  voiceDraft=(res.items||[]).map(x=>({...x,linked:state.shopping.find(y=>y.id===x.id)||null}));
  results.innerHTML=voiceDraft.length?'<b>Revisa compras y stock detectados</b>'+voiceDraft.map((x,i)=>'<label style="display:flex;gap:8px;align-items:flex-start;margin:12px 0"><input style="width:auto" type="checkbox" name="voicePick" value="'+i+'" checked><span>'+esc(x.linked?.name||x.name)+(x.qty?' · '+esc(x.qty):'')+'<br><small class="muted">'+esc(x.intent==='stock'?'Actualizar stock (sin cambiar estado)':x.linked?(x.linked.bought?'Volver a marcar pendiente':'Ya está pendiente'):'Nuevo · '+x.category)+'</small></span></label>').join(''):'No encontré productos para agregar.';
  status.textContent='Revisa y confirma. No se ha cambiado tu lista.';
  form.querySelector('[type=submit]').disabled=!voiceDraft.length;
 }catch(e){if(status.isConnected)status.textContent='No se pudo interpretar: '+e.message;}
 finally{if(btn.isConnected)btn.disabled=false;}
}
function applyShoppingVoice(){
 if(!syncReady||syncBusy||syncError){alert('Actualiza la información de Sheets primero.');return;}
 const selected=[...document.querySelectorAll('#entryform input[name=voicePick]:checked')].map(x=>voiceDraft?.[Number(x.value)]).filter(Boolean);
 if(!selected.length){alert('Selecciona al menos un producto.');return;}
 const norm=x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
 for(const x of selected){
  const existing=state.shopping.find(y=>y.id===x.id)||state.shopping.find(y=>norm(y.name)===norm(x.name));
  if(x.intent==='stock'){const target=existing||{id:uid(),name:x.name,category:x.category||'Otros',qty:'',notes:'',bought:true};target.stock=x.qty||'Disponible';target.stockUpdated=today();if(!existing)state.shopping.push(target);}
  else if(existing){existing.bought=false;if(x.qty)existing.qty=x.qty;}
  else state.shopping.push({id:uid(),name:x.name,category:x.category||'Otros',qty:x.qty||'',notes:'',bought:false});
 }
 shopFilter='Pendientes';shopQuery='';save();closeModal();render();
}

function applyPackCount(input,size){const form=input.form;form.elements.qtyGrams.value=input.value&&size?String(Math.round(Number(input.value)*size*100)/100):'';}
async function compactPurchaseImage(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{try{
   const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
   const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);
   canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
   URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',.78).split(',')[1]);
  }catch(e){URL.revokeObjectURL(url);reject(e)}};
  img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('No se pudo abrir la imagen. Prueba JPG o PNG.'))};img.src=url;
 });
}

async function scanPurchasePhoto(){

 const btn=box.querySelector('button');btn.disabled=true;btn.textContent='Analizando imagen…';
 try{
  const image=await compactPurchaseImage(file);
  const res=await runRemote('analyzePurchasePhoto',image,frm.elements.name.value);
  const v=res.product||{};
  for(const [key,value] of Object.entries({name:v.name,qtyGrams:v.qtyGrams,protein100:v.protein100,kcal100:v.kcal100,fat100:v.fat100,carbs100:v.carbs100,unit:v.unit,nutritionSource:v.nutritionSource,price:v.price})){
   if(value!==null&&value!==undefined&&value!==''&&frm.elements[key])frm.elements[key].value=value;
  }
  const inferred=(v.estimatedFields||[]).join(', ');
  box.querySelector('p').textContent=(res.message||'Revisa los datos detectados antes de guardar.')+(inferred?' Estimaciones: '+inferred+'.':'')+' Los campos sin evidencia quedan vacíos.';
  btn.textContent='↻ Volver a analizar';
 }catch(e){box.querySelector('p').textContent='No se pudo analizar: '+(e.message||e);btn.textContent='Reintentar escaneo'}
 finally{btn.disabled=false}
}

function petForm(id){let p=state.pets.find(v=>v.id===id);modal('Ficha de '+p.name,'Datos básicos de tu michi',f('Nombre','name',p.name,'text','required')+f('Emoji','emoji',p.emoji)+f('Comida actual','food',p.food,'text','',true)+area('Datos relevantes','notes',p.notes),`savePet('${id}')`)}function savePet(id){Object.assign(state.pets.find(v=>v.id===id),data());save();closeModal();render()}
function petLogForm(pet='Hera'){modal('Nuevo registro de gatos','Controles, síntomas, vacunas, alimentación y visitas',sel('¿De quién?','pet',state.pets.map(p=>p.name),pet)+sel('Tipo de registro','type',['Peso','Vómito','Veterinario','Vacuna','Desparasitación','Alimentación','Medicamento','Síntoma','Otro'])+f('Fecha','date',today(),'date','required')+f('Valor / vacuna / comida / kg','value','','text','',true)+area('Detalles / observaciones','notes'),`savePetLog()`)}function savePetLog(){state.petlogs.push({...data(),id:uid()});save();closeModal();render()}
function taskForm(id){let t=state.tasks.find(v=>v.id===id)||{};modal(id?'Editar rutina':'Nueva rutina','Frecuencia sugerida en días, ajustable según tu hogar',f('Actividad','name',t.name,'text','required',true)+sel('Área','category',['Dormitorio','Plantas','Lavandería','Mantenimiento','Compras','Gatos','Salud','Cocina','Baño','Otro'],t.category)+f('Repetir cada (días)','interval',t.interval||7,'number','min="1" required')+f('Última vez realizada','last',t.last,'date')+f('Responsable','person',t.person||'Jorge y Claudia')+area('Notas','notes',t.notes),`saveTask('${id||''}')`)}function saveTask(id){let x=data();x.interval=Number(x.interval);x.id=id||uid();if(id)state.tasks=state.tasks.map(t=>t.id===id?x:t);else state.tasks.push(x);save();closeModal();render()}function complete(id){let t=state.tasks.find(v=>v.id===id);t.last=today();state.events.push({id:uid(),date:today(),name:t.name,person:t.person,notes:'Rutina completada · '+t.category});save();render()}
function eventForm(){modal('Registrar actividad','Para compras, mantenimientos y cualquier acontecimiento',f('Actividad','name','','text','required',true)+f('Fecha','date',today(),'date','required')+f('Responsable','person','Jorge y Claudia')+area('Detalle (proveedor, monto, observaciones)','notes'),`saveEvent()`)}function saveEvent(){state.events.push({...data(),id:uid()});save();closeModal();render()}function del(collection,id){if(!confirm('¿Eliminar este registro?'))return;state[collection]=state[collection].filter(v=>v.id!==id);save();render()}
function quick(){modal('¿Qué vas a registrar?','Selecciona el módulo que quieras completar',`<div class="full" style="display:grid;gap:9px"><button class="btn outline" type="button" onclick="closeModal();medForm()">💊 Medicamento</button><button class="btn outline" type="button" onclick="closeModal();petLogForm()">🐾 Evento de Hera o Ramsés</button><button class="btn outline" type="button" onclick="closeModal();eventForm()">🏡 Actividad de casa</button><button class="btn outline" type="button" onclick="closeModal();taskForm()">🧹 Nueva rutina</button><button class="btn outline" type="button" onclick="closeModal();shopForm()">🛒 Producto de compras</button><button class="btn outline" type="button" onclick="closeModal();purchaseForm()">🧺 Compra con gramos y proteína</button></div>`,`closeModal()`)}function exportData(){const blob=new Blob([JSON.stringify({...state,version:1,exported:today()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Casa-CJ-respaldo-'+today()+'.json';a.click();URL.revokeObjectURL(url)}function importData(input){let file=input.files[0];if(!file)return;const reader=new FileReader;reader.onload=()=>{try{let o=JSON.parse(reader.result);if(!['meds','pets','petlogs','tasks','events'].every(k=>Array.isArray(o[k])))throw Error('Formato incompatible');if(!confirm('Esto reemplazará los datos actuales de este navegador. ¿Continuar?'))return;state={...defaultState(),...o};if(!Array.isArray(state.shopping))state.shopping=shoppingSeed.map(x=>({...x}));save();render();alert('Respaldo importado')}catch(e){alert('No se pudo importar: '+e.message)}};reader.readAsText(file)}function resetData(){if(confirm('¿Restablecer y borrar cambios, registros y eventos guardados en este dispositivo?')){state=defaultState();save();render()}}loginStart();
</script></body></html>
